name: Build Genesis Plus GX Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653"

      - name: Patch sources
        run: |
          sed -i 's/info->library_name = "Genesis Plus GX"/info->library_name = "Genesis Plus GX 480x464"/' libretro/libretro.c
          python3 << 'EOF'
          import re
          with open('core/vdp_ctrl.c', 'r') as f:
              s = f.read()
          s = re.sub(r'bitmap\.viewport\.w\s*=\s*\d+\s*;', 'bitmap.viewport.w = 480;', s)
          s = re.sub(r'bitmap\.viewport\.h\s*=\s*\d+\s*;', 'bitmap.viewport.h = 464;', s)
          s = re.sub(r'bitmap\.viewport\.ow\s*=\s*\d+\s*;', 'bitmap.viewport.ow = 480;', s)
          s = re.sub(r'bitmap\.viewport\.oh\s*=\s*\d+\s*;', 'bitmap.viewport.oh = 464;', s)
          with open('core/vdp_ctrl.c', 'w') as f:
              f.write(s)
          print('Patch applied')
          EOF

      - name: Build for Android ARMv7
        run: |
          export NDK=$ANDROID_SDK_ROOT/ndk/25.2.9519653
          export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin
          export CC=$TOOLCHAIN/armv7a-linux-androideabi21-clang
          export CXX=$TOOLCHAIN/armv7a-linux-androideabi21-clang++
          make -f Makefile.libretro \
            CC=$CC \
            CXX=$CXX \
            TARGET_NAME=genesis_plus_gx_480x464 \
            -j$(nproc)
          find . -maxdepth 1 -name "*.so"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: genesis-plus-gx-android
          path: genesis_plus_gx_480x464_libretro.so
