name: Build Genesis Plus GX Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653"

      - name: Build for Android ARMv7
        run: |
          export NDK=$ANDROID_SDK_ROOT/ndk/25.2.9519653
          export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin
          export CC=$TOOLCHAIN/armv7a-linux-androideabi21-clang
          export CXX=$TOOLCHAIN/armv7a-linux-androideabi21-clang++
          make -f Makefile.libretro \
            CC=$CC \
            CXX=$CXX \
            TARGET_NAME=genesis_plus_gx \
            -j$(nproc)
          mv genesis_plus_gx_libretro.dll genesis_plus_gx_libretro_android.so 2>/dev/null || true
          find . -maxdepth 1 -name "*.so" -o -name "*.dll"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: genesis-plus-gx-android
          path: genesis_plus_gx_libretro.so
