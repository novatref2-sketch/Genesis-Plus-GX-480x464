name: Build Genesis Plus GX Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653"

      - name: Build for Android ARMv7
        run: |
          export NDK=$ANDROID_SDK_ROOT/ndk/25.2.9519653
          export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin
          export CC=$TOOLCHAIN/armv7a-linux-androideabi21-clang
          export CXX=$TOOLCHAIN/armv7a-linux-androideabi21-clang++
          sed -i 's/info->library_name = "Genesis Plus GX"/info->library_name = "Genesis Plus GX 480x464"/' libretro/libretro.c
          sed -i 's/bitmap\.viewport\.w = 256/bitmap.viewport.w = 480/g' core/vdp_ctrl.c
          sed -i 's/bitmap\.viewport\.h = 192/bitmap.viewport.h = 464/g' core/vdp_ctrl.c
          sed -i 's/bitmap\.viewport\.w = 320/bitmap.viewport.w = 480/g' core/vdp_ctrl.c
          sed -i 's/bitmap\.viewport\.h = 224/bitmap.viewport.h = 464/g' core/vdp_ctrl.c
          grep -n "bitmap.viewport.w\|bitmap.viewport.h\|MAX_WIDTH\|MAX_HEIGHT\|vdp_pal" core/vdp_ctrl.c | head -30
          grep -n "bitmap.viewport.w\|bitmap.viewport.h" libretro/libretro.c | head -20
          make -f Makefile.libretro \
            CC=$CC \
            CXX=$CXX \
            TARGET_NAME=genesis_plus_gx_480x464 \
            -j$(nproc)
          find . -maxdepth 1 -name "*.so"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: genesis-plus-gx-android
          path: genesis_plus_gx_480x464_libretro.so
